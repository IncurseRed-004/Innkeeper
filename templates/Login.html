<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <style>
    body {
      padding-top: 20px;
      font-family: 'Poppins', sans-serif;
      background-color: #f4f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-card {
      border: none;
      border-radius: 24px; /* Makes the card curvy */
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08); /* Soft modern shadow */
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 600px;
      background: #ffffff;
    }

    .login-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 1.5rem;
    }

    .form-control {
      border-radius: 12px; /* Curvy inputs */
      padding: 0.8rem 1.2rem;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
    }

    .form-control:focus {
      background-color: #fff;
      border-color: #ff5722;
      box-shadow: 0 0 0 0.25rem rgba(255, 87, 34, 0.15); /* Orange focus ring */
    }

    .btn-login {
      background-color: #ff5722;
      color: white;
      border-radius: 12px; /* Curvy button */
      padding: 0.8rem;
      font-weight: 500;
      border: none;
      transition: background-color 0.2s ease-in-out;
    }

    .btn-login:hover {
      background-color: #e64a19;
      color: white;
    }

    .form-check-input:checked {
      background-color: #ff5722;
      border-color: #ff5722;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h3 class="text-center login-title">Please sign in</h3>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <input class="form-control" placeholder="Username" name="uname" type="username" required>
      </div>

      <div class="mb-3">
        <input class="form-control" placeholder="Password" name="pass" type="password" required>
      </div>

      <div class="mb-4 form-check">
  <!--        <input class="form-check-input" type="checkbox" value="Remember Me" id="rememberMe">-->
  <!--        <label class="form-check-label text-muted" for="rememberMe">-->
  <!--          Remember Me-->
  <!--        </label>-->
      </div>

      <button class="btn btn-login w-100" type="submit">Login</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
