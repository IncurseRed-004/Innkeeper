{% extends 'admin/admin_base.html' %}

{% block content %}

<table class="table table-striped">

    <tr>
        <th>name</th>
        <th>phone</th>
        <th>email</th>
        <th>delete</th>
        <th>update</th>
    </tr>
    {% for i in data %}
    <tr>
        <td>{{i.name}}</td>
        <td>{{i.phone}}</td>
        <td>{{i.email}}</td>
        <td><a href="{% url 'delete_owner' i.id %}" class="btn btn-danger">delete</a></td>
        <td><a href="{% url 'update_owner' i.id %}" class="btn btn-danger">Update</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}C
