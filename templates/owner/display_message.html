{% extends 'owner/owner_base.html' %}

{% block content %}


<body class="bg-light">

<div class="container mt-5">

    <h3 class="mb-4">Customer Messages</h3>

    <table class="table table-bordered table-striped table-hover bg-white">
        <thead class="table-dark">
            <tr>
                <th>Resort Name</th>
                <th>Message</th>
                <th>Respond</th>
            </tr>
        </thead>

        <tbody>
            {% for chat in data %}
            <tr>

                <td>{{ chat.resort.name }}</td>
                <td>{{ chat.message }}</td>
                <td>
                    {% if chat.reply %}
                        <span>{{chat.reply}}</span>
                    {% else %}
                    <a href="{% url 'reply_message' chat.id %}"
                       class="btn btn-primary btn-sm">
                       Reply
                    </a>
                    {% endif %}
                </td>

            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center">
                    No messages found.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</div>

</body>
</html>

{% endblock %}
