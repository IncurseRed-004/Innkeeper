{% extends 'owner/owner_base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-4">
    <h3>Edit Resort</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">
            Update Resort
        </button>

    </form>
</div>

{% endblock %}
