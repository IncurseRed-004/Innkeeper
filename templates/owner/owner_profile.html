{% extends 'owner/owner_base.html' %}

{% block content %}

<style>
    .profile-page {
        min-height: calc(100vh - 70px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 25px;
        background: #f4f5f7;
    }

    .profile-card {
        width: 100%;
        max-width: 750px;
        background: #ffffff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        display: flex;
        position: relative;
    }

    /* Left side */
    .profile-left {
        width: 38%;
        background: linear-gradient(145deg, #171b24, #252b38);
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 25px;
        text-align: center;
    }

    .profile-avatar {
        width: 115px;
        height: 115px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 700;
        color: white;
        margin-bottom: 20px;
        border: 5px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }

    .profile-name {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        color: #ffffff;
    }

    /* Right side */
    .profile-right {
        flex: 1;
        padding: 45px 45px 40px;
        position: relative;
    }

    .profile-title {
        font-size: 24px;
        font-weight: 700;
        color: #20242d;
        margin: 0 0 8px;
    }

    .profile-subtitle {
        color: #8a909c;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .info-item {
        margin-bottom: 24px;
    }

    .info-label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #8a909c;
        margin-bottom: 7px;
    }

    .info-value {
        font-size: 16px;
        font-weight: 500;
        color: #272b34;
        margin: 0;
        word-break: break-word;
    }

    .profile-divider {
        border: 0;
        border-top: 1px solid #eeeeee;
        margin: 0 0 25px;
    }

    .edit-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #171b24;
        color: white;
        text-decoration: none;
        border: none;
        border-radius: 9px;
        padding: 11px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .edit-button:hover {
        background: #303746;
        color: white;
        transform: translateY(-1px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    }

    .edit-icon {
        font-size: 15px;
    }

    /* Mobile */
    @media (max-width: 650px) {
        .profile-card {
            flex-direction: column;
        }

        .profile-left {
            width: 100%;
            padding: 35px 20px;
        }

        .profile-right {
            padding: 35px 25px;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            font-size: 36px;
        }
    }
</style>


<section class="profile-page"
         style="background-color: #f4f5f7;" >

    <div class="profile-card">

        <!-- Profile Avatar -->
        <div class="profile-left">

            <div class="profile-avatar">
                {{ owner_data.name|first|upper }}
            </div>

            <h2 class="profile-name">
                {{ owner_data.name }}
            </h2>

        </div>


        <!-- Profile Information -->
        <div class="profile-right">

            <h1 class="profile-title">My Profile</h1>

            <p class="profile-subtitle">
                Your personal information
            </p>

            <hr class="profile-divider">


            <!-- Name -->
            <div class="info-item">
                <span class="info-label">Name</span>

                <p class="info-value">
                    {{ owner_data.name }}
                </p>
            </div>


            <!-- Email -->
            <div class="info-item">
                <span class="info-label">Email</span>

                <p class="info-value">
                    {{ owner_data.email }}
                </p>
            </div>


            <!-- Phone -->
            <div class="info-item">
                <span class="info-label">Phone</span>

                <p class="info-value">
                    {{ owner_data.phone }}
                </p>
            </div>


            <!-- Edit Button -->
            <a href="{% url 'edit_owner' owner_data.id %}" class="edit-button" type="submit">
                <span class="edit-icon">✎</span>
                Edit Profile
            </a>

        </div>

    </div>

</section>
