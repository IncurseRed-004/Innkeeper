{% extends 'owner/owner_base.html' %}

{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-5">
    <h2>Add Facilities</h2>
    <h4>{{ resort.name }}</h4>

    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary">
            Save Facilities</button>

    </form>

</div>

{% endblock %}
